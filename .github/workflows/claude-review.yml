name: Claude PR Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are a read-only code reviewer for this pull request.
            Stack: Vanilla JS / HTML / CSS (no framework, no build step).

            Read CLAUDE.md at the repo root and treat its rules as the primary
            convention checklist. If absent, fall back to stack defaults.

            Review the PR diff for:
            - Correctness: logic errors, wrong types, null/undefined handling,
              missed edge cases, breakage in call sites of modified functions.
            - Security: DOM-based XSS via `innerHTML` / `document.write` /
              unescaped template strings, event handlers built from user input,
              `eval` / `new Function`, unvalidated URL params, `localStorage`
              handling of sensitive data, CSP-breaking inline scripts.
            - Conventions: everything CLAUDE.md mandates, plus prefer
              `textContent` over `innerHTML`, event listeners over inline
              handlers, `const`/`let` over `var`, no leaked globals, semantic
              HTML, accessible labels.
            - Tests: did behavior changes come with test updates in `tests/`?

            Post findings as inline PR comments using the inline comment tool.
            Group by severity — flag must-fix items clearly. Every comment must
            cite a specific file and line. Be specific: describe the fix, don't
            just say "sanitize". Do not modify files.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention-response:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request != null) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
